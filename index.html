*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Microsoft YaHei','PingFang SC','SimHei',sans-serif;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, rgba(255,255,255,0) 2px 4px),
    linear-gradient(180deg, var(--sky) 0 62%, var(--sky2) 62% 100%);
  color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start; padding:30px 16px 52px; position:relative; overflow-x:hidden;
  image-rendering:pixelated;
}
body::before{ content:''; position:fixed; top:0; left:0; width:10px; height:10px; background:transparent;
  box-shadow:
    12vw 12vh 0 0 var(--accent3),
    82vw 16vh 0 0 var(--accent),
    8vw 62vh 0 0 var(--accent4),
    88vw 70vh 0 0 var(--accent3),
    68vw 8vh 0 0 var(--accent2),
    30vw 86vh 0 0 var(--accent);
  opacity:.85; pointer-events:none; z-index:0;
}
body::after{ content:''; position:fixed; left:0; right:0; bottom:0; height:26px; z-index:0;
  background:repeating-linear-gradient(90deg,var(--sea) 0 26px,var(--sea2) 26px 52px);
  border-top:4px solid var(--bd);
}
#app{width:100%; max-width:520px; margin:0 auto; position:relative; z-index:1;}
.card{ background:var(--card); border:4px solid var(--bd); padding:26px 20px; box-shadow:8px 8px 0 rgba(0,0,0,.55); position:relative; }
.progress{height:16px; background:#141428; border:3px solid var(--bd); margin-bottom:16px; box-shadow:3px 3px 0 rgba(0,0,0,.5); padding:2px;}
.progress > div{height:100%; background:repeating-linear-gradient(90deg,var(--accent) 0 14px,var(--accent3) 14px 28px); transition:width .35s;}
.tag{display:inline-block; font-size:11px; font-family:var(--px); color:#fff; background:var(--accent); border:3px solid var(--bd); padding:5px 10px; margin-bottom:12px; box-shadow:3px 3px 0 rgba(0,0,0,.5); letter-spacing:1px;}
.tag.game{background:var(--accent4);}
h1{font-family:var(--px); font-size:21px; margin:0 0 10px; line-height:1.6; text-shadow:3px 3px 0 var(--accent3); letter-spacing:1px;}
h2{font-family:var(--px); font-size:17px; margin:0 0 12px; line-height:1.5;}
p{color:var(--muted); line-height:1.7; margin:8px 0;}
.qtitle{font-size:19px; line-height:1.6; margin:8px 0 16px; font-weight:700;}
.story{font-size:14.5px; line-height:1.8; color:#3a3a1f; background:#fff8d6; border:3px dashed var(--bd); padding:14px 16px; margin:2px 0 14px;}
.story::before{content:'▶ 剧情'; display:block; font-family:var(--px); font-size:10px; color:var(--accent); letter-spacing:1px; margin-bottom:6px;}
.story b{color:var(--accent);}
.sub{font-size:13px; color:var(--muted); margin-top:-10px; margin-bottom:12px;}
.opt{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:3px solid var(--bd); background:#fff; padding:13px 14px; margin-bottom:12px; font-size:15.5px; cursor:pointer; color:var(--ink); font-family:inherit; box-shadow:3px 3px 0 rgba(0,0,0,.5); }
.opt:hover{background:#fff8e6;}
.opt:active{transform:translate(3px,3px); box-shadow:0 0 0 #000;}
.opt.sel{background:var(--accent); color:#fff;}
.opt .badge{flex:none; width:26px; height:26px; background:#141428; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; font-family:var(--px); border:2px solid var(--bd);}
.opt.sel .badge{background:#fff; color:var(--accent);}
.btns{display:flex; gap:10px; margin-top:18px;}
.btn{ flex:1; border:3px solid var(--bd); padding:13px; font-size:15px; cursor:pointer; font-family:var(--px); letter-spacing:1px; box-shadow:4px 4px 0 rgba(0,0,0,.5); background:#fff; color:var(--ink); line-height:1.6; }
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:#fff; color:var(--accent);}
.btn.small{flex:none; padding:9px 14px; font-size:12px;}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 #000;}
.back{display:inline-block; border:3px solid var(--bd); background:#fff; font-size:11px; color:var(--accent); cursor:pointer; font-family:var(--px); padding:6px 10px; margin-bottom:12px; box-shadow:2px 2px 0 rgba(0,0,0,.5); letter-spacing:1px;}
.check{display:flex; align-items:center; gap:10px; border:3px solid var(--bd); padding:12px 14px; margin-bottom:10px; cursor:pointer; background:#fff; box-shadow:2px 2px 0 rgba(0,0,0,.5);}
.check.sel{background:var(--accent4); color:#fff;}
.check .box{flex:none; width:22px; height:22px; border:3px solid var(--bd); background:#fff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900;}
.check.sel .box{background:var(--accent4); border-color:var(--bd);}
.ranges{display:flex; flex-wrap:wrap; gap:9px;}
.ranges .opt{flex:none; width:42px; height:42px; padding:0; justify-content:center; font-family:var(--px); font-size:13px;}
.hero{text-align:center; margin:12px 0 6px; animation:float 3s ease-in-out infinite;}
.hero .kao{vertical-align:bottom;}
.typename{text-align:center; font-family:var(--px); font-size:20px; margin:4px 0 2px; letter-spacing:1px;}
.oneline{text-align:center; color:var(--muted); margin-bottom:16px;}
.funpanel{background:#ffe9d9; border:3px solid var(--bd); box-shadow:4px 4px 0 rgba(0,0,0,.5);}
.funlevel{font-family:var(--px); font-size:22px; color:var(--accent); margin:2px 0 6px; text-shadow:2px 2px 0 #ffd6b0; letter-spacing:1px;}
.funline{font-size:14px; color:#8a4a22; line-height:1.6;}
.poster{background:repeating-linear-gradient(90deg,var(--sea) 0 26px,var(--sea2) 26px 52px); color:#fff; border:4px solid var(--bd); padding:26px 20px; text-align:center; position:relative; box-shadow:8px 8px 0 rgba(0,0,0,.55);}
.poster .emoji{display:flex; justify-content:center; animation:float 3.4s ease-in-out infinite;}
.poster .big{font-family:var(--px); font-size:20px; line-height:1.5; margin:10px 0 6px; text-shadow:3px 3px 0 rgba(0,0,0,.5); letter-spacing:1px;}
.poster .mid{font-size:14.5px; opacity:.97; line-height:1.7; text-shadow:1px 1px 0 rgba(0,0,0,.4);}
.poster .stat{font-size:13px; opacity:.97; margin:14px 0; background:rgba(0,0,0,.28); border:3px solid rgba(0,0,0,.45); padding:10px 12px; line-height:1.6;}
.poster .steps{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:12px 0;}
.poster .steps span{background:rgba(0,0,0,.28); border:3px solid rgba(0,0,0,.45); padding:6px 12px; font-size:13px;}
.poster .hotline{display:flex; gap:10px; margin-top:14px;}
.poster .hl{flex:1; background:rgba(0,0,0,.28); border:3px solid rgba(0,0,0,.45); padding:12px 8px;}
.poster .hl b{display:block; font-family:var(--px); font-size:17px; letter-spacing:1px; margin:2px 0; color:#fff;}
.poster .hl span{font-size:12px; opacity:.95;}
.poster .call{font-size:13px; line-height:1.7; margin-top:14px; opacity:.97; text-shadow:1px 1px 0 rgba(0,0,0,.4);}
@keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
@keyframes fi{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px;}
.chip{font-size:12px; padding:5px 12px; background:#fff; color:var(--accent); font-family:var(--px); border:2px solid var(--bd); box-shadow:2px 2px 0 rgba(0,0,0,.5); letter-spacing:1px;}
.bars{margin:14px 0;}
.bar-row{margin-bottom:12px;}
.bar-label{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:5px; font-weight:700;}
.bar-label b{font-family:var(--px); font-size:12px; color:var(--ink);}
.bar-track{height:16px; background:#fff; border:3px solid var(--bd); box-shadow:2px 2px 0 rgba(0,0,0,.5);}
.bar-fill{height:100%; transition:width .5s;}
.fill-c{background:var(--accent2);}
.fill-a{background:var(--act);}
.sq{display:inline-block; width:12px; height:12px; border:2px solid var(--bd); vertical-align:-2px; margin-right:6px;}
.sq-c{background:var(--accent2);}
.sq-a{background:var(--act);}
.panel{border:3px solid var(--bd); padding:14px 16px; margin:12px 0; background:#fff; box-shadow:3px 3px 0 rgba(0,0,0,.5);}
.panel .pt{font-family:var(--px); font-size:11px; color:var(--accent); margin-bottom:5px; letter-spacing:1px;}
.panel .pv{font-size:15px; line-height:1.6;}
.code{font-family:var(--px); font-size:20px; letter-spacing:4px; color:var(--accent); text-align:center; margin:8px 0; text-shadow:2px 2px 0 #ffe28a;}
.inp{width:100%; border:3px solid var(--bd); padding:12px; font-size:15px; font-family:var(--px); letter-spacing:2px; color:var(--ink); background:#fff; box-shadow:3px 3px 0 rgba(0,0,0,.5);}
.inp:focus{border-color:var(--accent); outline:none;}
.duo-card{background:var(--accent2); color:#fff; border:4px solid var(--bd); padding:20px; text-align:center; margin-top:14px; box-shadow:5px 5px 0 rgba(0,0,0,.5);}
.duo-card .dn{font-family:var(--px); font-size:19px; margin:6px 0; letter-spacing:1px;}
.duo-card .dd{font-size:14px; opacity:.96; line-height:1.6;}
.duo-card .types{display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
.duo-card .types span{background:rgba(0,0,0,.22); border:3px solid rgba(255,255,255,.5); padding:5px 12px; font-size:13px;}
.interlude{text-align:center; padding:8px 0;}
.big-emoji{display:flex; justify-content:center; animation:float 3s ease-in-out infinite;}
.interlude h2{font-size:18px; margin:12px 0 8px;}
.interlude .intro{font-size:15px; color:#3a3a30; line-height:1.8; text-align:left; background:#fff8d6; border:3px dashed var(--bd); padding:16px; margin:14px 0;}
.interlude .intro b{color:var(--accent);}
.foot{margin-top:18px; text-align:center; font-size:12px; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.55);}
.foot a{color:#fff; text-decoration:underline; cursor:pointer; background:var(--accent); border:3px solid var(--bd); padding:4px 10px; box-shadow:3px 3px 0 rgba(0,0,0,.5);}
.hidden{display:none !important;}
.modal-ov{position:fixed; inset:0; background:rgba(10,10,22,.78); display:flex; align-items:center; justify-content:center; z-index:99; padding:20px;}
.modal{background:var(--card); border:4px solid var(--bd); padding:26px 22px; max-width:340px; width:100%; text-align:center; box-shadow:8px 8px 0 #000; animation:fi .2s ease;}
.modal-emoji{font-size:30px; margin-bottom:8px; animation:float 2.4s ease-in-out infinite; font-family:var(--px); color:var(--accent); letter-spacing:3px;}
.modal-title{font-family:var(--px); font-size:16px; margin-bottom:8px; letter-spacing:1px;}
.modal-body{font-size:14px; color:var(--muted); line-height:1.7; margin-bottom:16px;}
.fade-in{animation:fi .3s ease;}
.kao{display:inline-block; font-size:38px; line-height:1.3; white-space:nowrap; text-shadow:2px 2px 0 rgba(0,0,0,.18); letter-spacing:1px;}
.kao.t1{color:var(--accent4);}
.kao.t2{color:var(--accent3);}
.kao.t3{color:var(--accent2);}

        } else {

        buffer.put(PAD1, 8);

      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {

      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';

      img += '/>';

        case '>': escaped += '&gt;'; break;

      var max = size - margin;

        ' █': '▄',
        '  ': ' '

      var max = size - margin;

      var black = Array(cellSize+1).join('  ');

        var b0 = bin.read();
        if (b0 == -1) break;

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

    }();

      var bytes = [];

function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ================= 计分 ================= */
function computeResult(ans){
  const cogs=[], acts=[];
  const dimCog=[[],[],[]], dimAct=[[],[],[]];
  const factors = { OB:0, AI:0, HS:0 };
  QUESTIONS.forEach(q=>{
    const v = ans[q.id];
    if(typeof v!=='number') return;
    if(q.track==='cog'){ cogs.push(v); dimCog[q.dim].push(v); }
    else if(q.track==='act'){ acts.push(v); dimAct[q.dim].push(v); }
    if(q.factor && factors[q.factor]!==undefined) factors[q.factor] += v;
  });
  const C = mean(cogs), A = mean(acts), GAP = C - A;
  const OB = factors.OB, AI = factors.AI, HS = factors.HS;
  const D = [0,1,2].map(d => mean(dimCog[d]) + mean(dimAct[d]));
  const dom = D.indexOf(Math.max(...D));
  const weak = D.indexOf(Math.min(...D));
  /* 知行形态：固定阈值 2.0（正式投放可用样本中位数替换） */
  const form = (C>=2 ? (A>=2?0:1) : (A>=2?2:3));
  const typeId = dom*4 + form;
  const tags = [];
  if(HS>=6) tags.push('HS');
  if(OB>=6) tags.push('OB');
  if(AI>=6) tags.push('AI');
  const gapBucket = Math.max(0, Math.min(15, Math.round((GAP+4)/8*15)));
  return { C, A, GAP, OB, AI, HS, D, dom, weak, form, typeId, tags, gapBucket,
    dimCog, dimAct };
}

/* ================= 口令（本地编码，供双人图鉴） ================= */
function makeCode(r){
  const n = (r.typeId*8 + r.tags.length)*16 + r.gapBucket;
  const body = n.toString(36).toUpperCase().padStart(3,'0');
  const check = (n%36).toString(36).toUpperCase();
  return body + check + 'X' + body[0];
}
function parseCode(code){
  code = (code||'').toUpperCase().replace(/\s/g,'');
  if(code.length!==6) return null;
  const body = code.slice(0,3), check = code[3];
  const n = parseInt(body,36);
  if(Number.isNaN(n)) return null;
  if((n%36).toString(36).toUpperCase() !== check) return null;
  const gap = n%16; let m = Math.floor(n/16);
  const tagsLen = m%8; m = Math.floor(m/8);
  const typeId = m;
  return { typeId, tagsLen, gap, form: typeId%4, dim: Math.floor(typeId/4) };
}

function funTitle(r){
  const s = (r.C + r.A) / 2;
  const level = s>=3.6 ? '至尊王者' : s>=3.0 ? '荣耀星耀' : s>=2.4 ? '秩序钻石' : s>=1.8 ? '倔强铂金' : s>=1.2 ? '黄金段位' : '青铜萌新';
  const jokes = {
    0: ['互联网清流，建议原地出道带带弟弟','稳如老狗，冲浪界的人间清醒'],
    1: ['嘴强王者：道理我都懂，就是手不动','收藏＝做过，转发＝学会'],
    2: ['一顿操作猛如虎，一看方向全是坑','行动派，但风险雷达基本关机'],
    3: ['裸奔冲浪手：人在江湖飘，全靠运气好','初生牛犊不怕虎，怕虎也得先浪'],
  };
  const joke = jokes[r.form][(r.gapBucket + r.dom) % jokes[r.form].length];
  return { level, joke };
}

function reasonText(r){
  const formWhy = {
    0: '你属于「知行合一」，平时很少掉链子。真要出问题，多半是关键时刻一犹豫，或对最新套路不够了解。',
    1: '你最大的问题是「想得到却做不到」：道理全懂，行动永远排在「明天」。',
    2: '你习惯凭直觉和手感防护，缺少系统的风险认知，遇到没见过的新套路就容易踩坑。',
    3: '你对网络风险基本不设防，风险感知和应对都比较弱，掉链子几乎是常态。',
  }[r.form];
  const f = Math.max(r.OB, r.AI, r.HS);
  let factorWhy;
  if(f >= 6){
    if(r.HS === f) factorWhy = '再具体点：你的「求助羞耻」最突出，习惯独自硬扛，白白错过很多能拉你一把的人。';
    else if(r.AI === f) factorWhy = '再具体点：你的「行动惰性」最突出，不是不懂，而是懒得动手、一拖再拖。';
    else factorWhy = '再具体点：你的「乐观偏见」最突出，总觉得「倒霉的不会是我」。';
  } else {
    factorWhy = '三个「坑」没有特别突出的，你的问题更多出在整体意识和具体行动上。';
  }
  return formWhy + ' ' + factorWhy;
}

function weakKind(r){
  const D = r.D;
  const max = Math.max(...D), min = Math.min(...D);
  const spread = max - min;
  const avg = (D[0] + D[1] + D[2]) / 3;
  if(spread < 0.7){
    if(avg <= 2.0) return 'low';
    if(avg >= 6.0) return 'high';
    return 'balanced';
  }
  return 'uneven';
}

function weakText(r){
  const k = weakKind(r);
  if(k === 'low') return '三个维度都偏薄弱，建议从你最有感触的场景开始，系统补课';
  if(k === 'high') return '三面都很稳，没有明显漏洞——继续保持，并把这份提醒带给朋友';
  if(k === 'balanced') return '三面比较均衡，没有特别突出的短板，优先加固你日常最常遇到的场景';
  return DIM_NAMES[r.weak] + '（最弱的一环，也是最该补的）';
}

function buildAdvice(r){
  const dimAdvice = {
    0: '下次遇到网暴：先截图存证再走平台举报，情绪上头先别回怼。',
    1: '今天就给重要账号开二次验证、清理 App 权限，密码别再「一套通用」。',
    2: '转发前停三秒：查来源、等权威信息，别当节奏的放大器。',
  };
  const k = weakKind(r);
  if(k === 'high') return '你已经很稳了，继续保持，顺便把这份提醒转给还在「裸奔」的朋友，能带一个是一个。';
  if(k === 'low') return '三面都要补，先从你最有感触的那一类开始，比如：' + dimAdvice[r.dom];
  if(k === 'balanced') return '三面比较均衡，建议挑你日常最常遇到的那一类先加固：' + dimAdvice[r.dom];
  if(r.form === 1) return '别再把「知道」当「做到」，选一件最小的事今天就完成：' + dimAdvice[r.weak];
  if(r.form === 2) return '你的直觉不错，但先补认知再行动更省力：' + dimAdvice[r.weak] + ' 拿不准时，先问一句「这事是真的吗」。';
  if(r.form === 0) return '你已经做得不错，只需把最弱的一环再加固一下：' + dimAdvice[r.weak];
  return '从最薄弱的环节开始，别贪多：' + dimAdvice[r.weak];
}

function bind(){
  card.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', ()=>act(el.dataset.act));
  });
  card.querySelectorAll('.opt[data-val]').forEach(el=>{

  });

function act(a){
  if(a==='start'){ state.screen='question'; state.idx=0; render(); }
  else if(a==='toResult'){
    if(!profileComplete()){ toast('还有几项没填哦，填完才能领结果（或点上面的「不填了」跳过）'); return; }
    finishToResult();
  }
  else if(a==='skipProfile'){ openPleadModal(); }
  else if(a==='back'){
    if(state.screen==='interlude'){ state.screen='question'; state.idx=16; render(); return; }
    if(state.idx>0){ state.idx--; render(); }
    else { state.screen='welcome'; render(); }
  }
  else if(a==='multiNext'){ nextQ(); }
  else if(a==='startPart2'){ state.idx=17; state.screen='question'; render(); }
  else if(a==='backHome'){ state.screen='welcome'; render(); }
  else if(a==='poster'){ state.screen='poster'; render(); }
  else if(a==='backResult'){ state.screen='result'; render(); }
  else if(a==='restart'){ resetAll(); state.screen='welcome'; render(); }
  else if(a==='copy'){
    const code = document.querySelector('.code').textContent;
    navigator.clipboard && navigator.clipboard.writeText(code).then(()=>toast('已复制口令'));
  }
  else if(a==='duo'){ doDuo(); }
  else if(a==='save'){ saveRecord(); }
  else if(a==='share'){ downloadShare(); }
}

function pickSingle(el){
  const q = QUESTIONS[state.idx];
  const v = parseInt(el.dataset.val,10);
  state.answers[q.id] = v;
  card.querySelectorAll('.opt[data-val]').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  if(q.kind==='single') setTimeout(()=>nextQ(), 160);
}

function toggleMulti(el){
  const q = QUESTIONS[state.idx];
  const v = parseInt(el.dataset.val,10);
  if(!Array.isArray(state.answers[q.id])) state.answers[q.id] = [];
  const arr = state.answers[q.id];
  const i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);
  el.classList.toggle('sel');
}

function pickBasic(el){
  const key = el.dataset.bkey, val = el.dataset.bval;
  const def = BASIC.find(b=>b.key===key);
  if(def.multi){
    if(!Array.isArray(state.basic[key])) state.basic[key] = [];
    const arr = state.basic[key];
    const i = arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else arr.push(val);
    card.querySelectorAll(`[data-bkey="${key}"][data-bval="${val}"]`).forEach(x=>x.classList.toggle('sel', i<0));
  } else {
    state.basic[key] = val;
    card.querySelectorAll(`[data-bkey="${key}"]`).forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
  }
}

function nextQ(){
  const q = QUESTIONS[state.idx];
  const v = state.answers[q.id];
  if(q.kind==='range' || q.kind==='multi'){
    if(v===undefined || (Array.isArray(v) && v.length===0)){
      toast('这题还没选哦，选一个再继续～'); return;
    }
  }
  if(state.idx < QUESTIONS.length-1){
    if(state.idx === 16){ state.screen='interlude'; render(); }
    else { state.idx++; render(); }
  }
  else { state.screen = 'profile'; render(); }
}

function supabaseInsert(rec){
  if(!supabaseConfigured()) return Promise.resolve(false);
  const base = String(window.SUPABASE_URL).replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  return fetch(base + '/rest/v1/responses', {
    method:'POST',
    headers:{
      apikey: window.SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + window.SUPABASE_ANON_KEY,

    body: JSON.stringify({ ts:rec.ts, basic:rec.basic, answers:rec.answers, result:rec.result })
  }).then(r=> r.ok || r.status===201).catch(()=>false);
}

  if(state.saved) return;
  /* 只有填写过个人信息的才允许保存/提交，防止刷数据 */
  if(!profileComplete()) return;

function shareUrl(){
  return SHARE_URL.trim() || location.href;
}

function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapLines(ctx, text, maxWidth){
  const out = [];
  let line = '';
  for(const ch of text){
    const test = line + ch;
    if(line && ctx.measureText(test).width > maxWidth){ out.push(line); line = ch; }
    else line = test;
  }
  if(line) out.push(line);
  return out;
}

function drawQRInto(ctx, x, y, size){
  let qr;
  try{
    qr = qrcode(0, 'M');
    qr.addData(shareUrl(), 'Byte');
    qr.make();
  }catch(e){
    qr = qrcode(0, 'L');
    qr.addData(shareUrl(), 'Byte');
    qr.make();
  }
  const n = qr.getModuleCount();
  const quiet = 4;
  const total = n + quiet*2;
  const cell = size / total;
  ctx.fillStyle = '#000';
  for(let r=0; r<n; r++){
    for(let c=0; c<n; c++){
      if(qr.isDark(r, c)){
        ctx.fillRect(x + (c+quiet)*cell, y + (r+quiet)*cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
}

  const fun = funTitle(r);

  ctx.fillStyle = '#2a2a3e';
  roundRectPath(ctx, cardX, cardY, cardW, cardH, 16);

  ctx.strokeStyle = '#3f3f5c';

  ctx.fillText('互联网防坑段位', CX, cardY + 40);
  ctx.fillStyle = '#ffd6b0';
  ctx.font = '700 38px ' + F;
  ctx.fillText(fun.level, CX, cardY + 86);
  ctx.fillStyle = '#c9c9dc';
  ctx.font = '22px ' + F;
  ctx.fillText(fun.joke, CX, cardY + 122);

  let by = cardY + cardH + 28;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fcb000';
  ctx.font = '700 22px ' + F;
  ctx.fillText('你的「知」与「行」', 60, by);
  by += 30;
  function bar(label, val, color){
    ctx.fillStyle = '#c9c9dc';
    ctx.font = '21px ' + F;
    ctx.fillText(label + '  ' + val.toFixed(1) + '/4', 60, by);
    const bx = 60, bw = W-120, bh = 18;
    const bty = by + 12;
    ctx.fillStyle = '#3f3f5c';
    roundRectPath(ctx, bx, bty, bw, bh, 9); ctx.fill();
    const pct = Math.max(0, Math.min(1, val/4));
    ctx.fillStyle = color;
    if(pct > 0){ roundRectPath(ctx, bx+4, bty+4, (bw-8)*pct, bh-8, 6); ctx.fill(); }
    by += 64;
  }
  bar('认知（知道该怎么做）', r.C, '#3b7ef0');
  bar('行动（最可能怎么做）', r.A, '#ff7a1a');
  ctx.textAlign = 'center';

  ctx.fillStyle = '#fcb000';
  ctx.font = '700 22px ' + F;
  ctx.fillText('三维度得分', CX, by);
  by += 30;
  const dimColors = ['#e52521','#00a800','#3b66e2'];
  const colXs = [165, 375, 585];
  for(let d=0; d<3; d++){
    ctx.fillStyle = dimColors[d];
    ctx.font = '700 26px ' + F;
    ctx.fillText(DIM_NAMES[d], colXs[d], by + 10);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 40px ' + F;
    ctx.fillText(r.D[d].toFixed(1), colXs[d], by + 58);
  }
  by += 96;

  ctx.fillStyle = '#fcb000';
  ctx.font = '700 22px ' + F;
  ctx.fillText('给 TA 的一条建议', CX, by);
  by += 28;
  ctx.fillStyle = '#e8e8f0';
  ctx.font = '23px ' + F;
  const advLines = wrapLines(ctx, buildAdvice(r), W-100);
  for(const l of advLines){ ctx.fillText(l, CX, by); by += 32; }

  by += 16;
  const qrSize = 300;
  const qrX = (W - qrSize)/2;
  ctx.fillStyle = '#ffffff';
  roundRectPath(ctx, qrX-20, by-20, qrSize+40, qrSize+40, 18); ctx.fill();
  drawQRInto(ctx, qrX, by, qrSize);
  by += qrSize + 46;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 26px ' + F;
  ctx.fillText('扫码 / 长按识别 · 测测你的段位', CX, by);
  by += 34;
  ctx.fillStyle = '#8b8ba3';
  ctx.font = '20px ' + F;
  ctx.fillText('匿名作答 · 数据仅用于课程社会调查', CX, by);

  return c;
}

function downloadShare(){
  if(!state.result){ toast('先完成测试再生成分享图哦'); return; }
  try{
    const c = makeShareCanvas(state.result);
    c.toBlob(blob=>{
      if(!blob){ toast('生成失败，换个浏览器试试'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '我的网上冲浪段位.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      toast('分享图已生成，快去转发吧');
    }, 'image/png');
  }catch(e){
    toast('生成失败：' + e.message);
  }
}

/* 启动 */
render();
</script>
</body>
</html>
